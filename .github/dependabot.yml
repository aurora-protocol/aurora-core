version: 2

# This repository reviews and merges one pull request at a time, so both
# ecosystems batch their updates into a single grouped pull request per month
# and cap themselves at one open pull request. CI (the three-OS test matrix
# plus production-evidence) is what verifies each bump.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      go-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: deps

  # Workflows pin actions by commit SHA; dependabot rewrites the SHA and the
  # trailing version comment together, which is what keeps the pins current
  # instead of merely immutable.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: build(ci)
