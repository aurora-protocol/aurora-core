name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Test lab build gates
        run: go test -tags=aurora_lab ./...
      - name: Check structural vector drift
        run: go run ./cmd/auroractl vectors --check
      - name: Check real crypto vector drift
        run: go run ./cmd/auroractl vectors --real-crypto --check
      - name: Check negative vector drift
        run: go run ./cmd/auroractl vectors --negative --check
      - name: Check negative vector rejection coverage
        run: go run ./cmd/auroractl negative-vectors-check
      - name: Check crypto provider agreement
        run: go run ./cmd/auroractl crypto-check
      - name: Check public wire markers
        run: go run ./cmd/auroractl wire-check
      - name: Check transport carrier conformance
        run: go run ./cmd/auroractl transport-check
      - name: Check proxy-flow conformance
        run: go run ./cmd/auroractl flow-check
      - name: Check split-route conformance
        run: go run ./cmd/auroractl route-check
      - name: Check performance and bad-path validation
        run: go run ./cmd/auroractl perf-check
      - name: Check release gates
        run: go run ./cmd/auroractl release-gate-check
      - name: Check portable host build matrix
        if: matrix.os == 'ubuntu-latest'
        run: go run ./cmd/auroractl host-build-check --portable
      - name: Check Apple simulator host build
        if: matrix.os == 'macos-latest'
        run: go run ./cmd/auroractl host-build-check --apple-simulator
      - name: Check active-probe neutrality
        run: go run ./cmd/auroractl active-probes
      - name: Check classifier baseline
        run: go run ./cmd/auroractl classifier-check
      - name: Check external evaluation evidence verifier
        run: go run ./cmd/auroractl evaluation-check
      - name: Check deployment security assessment evidence
        run: go run ./cmd/auroractl deployment-security-check
      - name: Check platform adapter conformance
        run: go run ./cmd/auroractl platform-check
      - name: Check platform packaging conformance
        run: go run ./cmd/auroractl packaging-check
      - name: Check release readiness evidence
        run: go run ./cmd/auroractl release-check
      - name: Check production proof harness
        run: go run ./cmd/auroractl proof-check
      - name: Check issuer operations harness
        run: go run ./cmd/auroractl issuer-check
      - name: Check issuer service readiness
        run: go run ./cmd/auroractl issuerd-check
      - name: Check issuer HTTP daemon readiness
        run: go run ./cmd/auroractl issuerd-http-check
      - name: Check runnable server harness
        if: matrix.os == 'ubuntu-latest'
        run: go run ./cmd/auroractl server-check
      - name: Check live server-client interop
        if: matrix.os == 'ubuntu-latest'
        run: go run ./cmd/auroractl client-check
      - name: Check aggregate P0-P11 gates
        if: matrix.os == 'ubuntu-latest'
        run: go run ./cmd/auroractl p0-p11-check
      - name: Check cover-origin deployment harness
        run: go run ./cmd/auroractl cover-check

  production-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Race test
        run: go test -race ./...
      - name: Coverage floor
        run: |
          go test -covermode=atomic -coverprofile=coverage.out ./...
          go run ./cmd/auroractl coverage-check --profile coverage.out --minimum 70
      - name: Protocol fuzz smoke
        run: go test ./protocol -run '^$' -fuzz '^FuzzDecodeProtocolStructs$' -fuzztime=10s
      - name: Benchmark health
        shell: bash
        run: |
          set -o pipefail
          go test -run '^$' -bench . -benchtime=1x -benchmem ./... | tee benchmarks.txt
      - name: Live server load smoke
        shell: bash
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/aurorad" ./cmd/aurorad
          go build -o "$RUNNER_TEMP/auroractl" ./cmd/auroractl
          "$RUNNER_TEMP/aurorad" --listen 127.0.0.1:19443 >"$RUNNER_TEMP/aurorad.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:19443/cover >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "aurorad exited before readiness" >&2
              exit 1
            fi
            sleep 0.1
          done
          if [ "$ready" != true ]; then
            echo "aurorad did not become ready" >&2
            exit 1
          fi
          "$RUNNER_TEMP/auroractl" load-check --url http://127.0.0.1:19443/assets/app.bin --requests 200 --concurrency 8 --packet-bytes 1200 --request-limit 5s
      - name: Vulnerability scan
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f
        with:
          repo-checkout: false
          go-version-file: go.mod
          output-format: text
      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-evidence
          path: |
            coverage.out
            benchmarks.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aurorad-log
          path: ${{ runner.temp }}/aurorad.log
          if-no-files-found: ignore
          retention-days: 7
