name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Check structural vector drift
        run: go run ./cmd/auroractl vectors --check
      - name: Check public wire markers
        run: go run ./cmd/auroractl wire-check
