name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Check gofmt
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-clean (run 'gofmt -w .' and commit):"
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Test
        run: go test ./...
      - name: Check exclusive Linux TUN ownership
        # This test needs CAP_NET_ADMIN. Keep elevated execution off pull-request
        # content; the ordinary Linux test job still checks the exact ioctl flags.
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          go test -c -o "$RUNNER_TEMP/platform.test" ./platform
          sudo env AURORA_PRIVILEGED_TUN_TEST=1 "$RUNNER_TEMP/platform.test" \
            -test.run '^TestOpenLinuxTUNDeviceRejectsPreexistingPersistentInterface$' \
            -test.v
      - name: Test 32-bit decoders
        if: matrix.os == 'ubuntu-latest'
        env:
          CGO_ENABLED: 0
          GOARCH: "386"
          GOOS: linux
        run: go test ./carrier ./protocol ./wire
      - name: Test lab build gates
        run: go test -tags=aurora_lab ./...
      - name: Check structural vector drift
        run: go run ./cmd/auroractl vectors --check
      - name: Check real crypto vector drift
        run: go run ./cmd/auroractl vectors --real-crypto --check
      - name: Check negative vector drift
        run: go run ./cmd/auroractl vectors --negative --check
      - name: Check negative vector rejection coverage
        run: go run ./cmd/auroractl negative-vectors-check
      - name: Check crypto provider agreement
        run: go run ./cmd/auroractl crypto-check
      - name: Check public wire markers
        run: go run ./cmd/auroractl wire-check
      - name: Check transport carrier conformance
        run: go run ./cmd/auroractl transport-check
      - name: Check proxy-flow conformance
        run: go run ./cmd/auroractl flow-check
      - name: Check split-route conformance
        run: go run ./cmd/auroractl route-check
      - name: Check performance and bad-path validation
        run: go run ./cmd/auroractl perf-check
      - name: Check release gates
        run: go run ./cmd/auroractl release-gate-check
      - name: Check portable host build matrix
        if: matrix.os == 'ubuntu-latest'
        run: go run ./cmd/auroractl host-build-check --portable
      - name: Check Apple simulator host build
        if: matrix.os == 'macos-latest'
        run: go run ./cmd/auroractl host-build-check --apple-simulator
      - name: Check active-probe neutrality
        run: go run ./cmd/auroractl active-probes
      - name: Check classifier baseline
        run: go run ./cmd/auroractl classifier-check
      - name: Check external evaluation evidence verifier
        run: go run ./cmd/auroractl evaluation-check
      - name: Check deployment security assessment evidence
        run: go run ./cmd/auroractl deployment-security-check
      - name: Check platform adapter conformance
        run: go run ./cmd/auroractl platform-check
      - name: Check platform packaging conformance
        run: go run ./cmd/auroractl packaging-check
      - name: Check release readiness evidence
        run: go run ./cmd/auroractl release-check
      - name: Check production proof harness
        run: go run ./cmd/auroractl proof-check
      - name: Check issuer operations harness
        run: go run ./cmd/auroractl issuer-check
      - name: Check issuer service lab harness
        run: go run ./cmd/auroractl issuerd-check
      - name: Check issuer HTTP lab harness
        run: go run ./cmd/auroractl issuerd-http-check
      - name: Check runnable server harness
        if: matrix.os == 'ubuntu-latest'
        run: go run ./cmd/auroractl server-check
      - name: Check live server-client interop
        if: matrix.os == 'ubuntu-latest'
        run: go run ./cmd/auroractl client-check
      - name: Check aggregate P0-P11 gates
        if: matrix.os == 'ubuntu-latest'
        run: go run ./cmd/auroractl p0-p11-check
      - name: Check cover-origin deployment harness
        run: go run ./cmd/auroractl cover-check

  production-evidence:
    timeout-minutes: 35
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Race test
        timeout-minutes: 15
        run: go test -race -timeout 12m ./...
      - name: Coverage floor
        timeout-minutes: 12
        run: |
          go test -timeout 10m -covermode=atomic -coverprofile=coverage.out ./...
          go run ./cmd/auroractl coverage-check --profile coverage.out --minimum 70
      - name: Protocol fuzz smoke
        timeout-minutes: 5
        run: go test -timeout 3m ./protocol -run '^$' -fuzz '^FuzzDecodeProtocolStructs$' -fuzztime=10s
      - name: Network decoder fuzz smoke
        timeout-minutes: 8
        run: |
          go test -timeout 2m ./packet -run '^$' -fuzz '^FuzzDecodeAuroraPacket$' -fuzztime=10s
          go test -timeout 2m ./packet -run '^$' -fuzz '^FuzzDecodeAuroraPacketView$' -fuzztime=10s
          go test -timeout 2m ./server -run '^$' -fuzz '^FuzzDecodePacketBatch$' -fuzztime=10s
          go test -timeout 2m ./transport -run '^$' -fuzz '^FuzzRecordReader$' -fuzztime=10s
          go test -timeout 2m ./relay -run '^$' -fuzz '^FuzzSocketDNSQuestionResponseRoundTrip$' -fuzztime=10s
          go test -timeout 2m ./relay -run '^$' -fuzz '^FuzzSocketEgressFlowOpen$' -fuzztime=10s
          go test -timeout 2m ./client -run '^$' -fuzz '^FuzzPacketAdapterIngress$' -fuzztime=10s
          go test -timeout 2m ./wire -run '^$' -fuzz '^FuzzDecodeVarint$' -fuzztime=10s
      - name: Admission decoder fuzz smoke
        timeout-minutes: 8
        run: |
          go test -timeout 2m ./admission -run '^$' -fuzz '^FuzzDecodeAccessHintCredential$' -fuzztime=10s
          go test -timeout 2m ./admission -run '^$' -fuzz '^FuzzDecodeAccessHintCredentialSet$' -fuzztime=10s
          go test -timeout 2m ./carrier -run '^$' -fuzz '^FuzzDecodeMetadataResponse$' -fuzztime=10s
          go test -timeout 2m ./issuerd -run '^$' -fuzz '^FuzzDecodeAdmissionProofBytes$' -fuzztime=10s
          go test -timeout 2m ./route -run '^$' -fuzz '^FuzzDecodePrivatePrelude$' -fuzztime=10s
      - name: Native ABI fuzz smoke
        timeout-minutes: 5
        run: |
          go test -timeout 2m ./mobile/auroracore -run '^$' -fuzz '^FuzzNativeDispatchCodecOperations$' -fuzztime=10s
          go test -timeout 2m ./mobile/auroracore -run '^$' -fuzz '^FuzzNativeDispatchUnknownOperations$' -fuzztime=10s
      - name: Benchmark health
        timeout-minutes: 7
        shell: bash
        run: |
          set -o pipefail
          go test -timeout 5m -run '^$' -bench . -benchtime=1x -benchmem ./... | tee benchmarks.txt
      - name: Live server load smoke
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/aurorad" ./cmd/aurorad
          go build -o "$RUNNER_TEMP/auroractl" ./cmd/auroractl
          "$RUNNER_TEMP/aurorad" harness --listen 127.0.0.1:19443 >"$RUNNER_TEMP/aurorad.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 50); do
            if curl --fail --silent --connect-timeout 1 --max-time 1 http://127.0.0.1:19443/cover >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "aurorad exited before readiness" >&2
              exit 1
            fi
            sleep 0.1
          done
          if [ "$ready" != true ]; then
            echo "aurorad did not become ready" >&2
            exit 1
          fi
          "$RUNNER_TEMP/auroractl" load-check --url http://127.0.0.1:19443/assets/app.bin --requests 200 --concurrency 8 --packet-bytes 1200 --request-limit 5s
      - name: Static analysis
        timeout-minutes: 8
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: Vulnerability scan
        timeout-minutes: 10
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
      - name: Upload production evidence
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-evidence
          path: |
            coverage.out
            benchmarks.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Upload server log on failure
        if: failure()
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aurorad-log
          path: ${{ runner.temp }}/aurorad.log
          if-no-files-found: ignore
          retention-days: 7
